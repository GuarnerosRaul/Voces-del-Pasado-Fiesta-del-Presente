{% extends 'base.html' %}

{% block title %}Loggin Graficas | Voces del Pasado{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <h4 class="text-center fw-bold mb-3" style="color: #722F37;">Acceso a Estadísticas</h4>
                <p class="text-muted text-center small mb-4">Ingresa la clave del equipo para visualizar los resultados del evento.</p>

                {% if error %}
                    <div class="alert alert-danger py-2 text-center">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="password" name="clave" class="form-control text-center" placeholder="Contraseña de acceso" required>
                    </div>
                    <button type="submit" class="btn w-100 text-white fw-bold" style="background-color: #722F37;">
                        Ver Gráficas
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
